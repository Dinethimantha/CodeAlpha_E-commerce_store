
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | NovaStore</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .orders-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .orders-container h1 {
            text-align: center;
            color: #172b4d;
            margin-bottom: 35px;
        }

        .order-card {
            background: #fff3e7;
            border: 1px solid #ead9c8;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #ead9c8;
            padding-bottom: 15px;
            margin-bottom: 18px;
        }

        .order-header h3 {
            color: #172b4d;
            overflow-wrap: anywhere;
        }

        .order-status {
            display: inline-block;
            background: #d9f3df;
            color: #23733a;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .order-status.cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .order-details h4 {
            grid-column: 1 / -1;
            color: #172b4d;
        }

        .order-details p {
            color: #444;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .order-products {
            border-top: 1px solid #ead9c8;
            padding-top: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            color: #444;
        }

        .order-item strong {
            color: #172b4d;
        }

        .order-summary {
            border-top: 1px solid #d8c5b2;
            margin-top: 15px;
            padding-top: 15px;
            text-align: right;
            color: #444;
            line-height: 2;
        }

        .order-summary h3 {
            font-size: 19px;
            color: #e87932;
        }

        /* ORDER TRACKING */

        .tracking-section {
            background: #ffffff;
            border: 1px solid #ead9c8;
            border-radius: 12px;
            padding: 22px 18px;
            margin: 22px 0;
        }

        .tracking-section h4 {
            color: #172b4d;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .tracking-progress {
            display: flex;
            justify-content: space-between;
            position: relative;
            gap: 5px;
        }

        .tracking-progress::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: #e5e7eb;
            z-index: 0;
        }

        .tracking-line {
            position: absolute;
            top: 15px;
            left: 10%;
            height: 4px;
            background: #e87932;
            z-index: 1;
            transition: width 0.4s ease;
        }

        .tracking-step {
            position: relative;
            z-index: 2;
            flex: 1;
            text-align: center;
        }

        .tracking-circle {
            width: 32px;
            height: 32px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #e5e7eb;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            border: 3px solid #fff;
        }

        .tracking-step.completed .tracking-circle {
            background: #e87932;
            color: white;
        }

        .tracking-step.active .tracking-circle {
            background: #172b4d;
            color: white;
            box-shadow: 0 0 0 4px rgba(23, 43, 77, 0.12);
        }

        .tracking-step p {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .tracking-step.completed p,
        .tracking-step.active p {
            color: #172b4d;
        }

        .tracking-message {
            margin-top: 22px;
            padding: 12px;
            background: #fff3e7;
            border-radius: 8px;
            color: #8a4b22;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }

        .cancelled-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }

        .empty-orders {
            text-align: center;
            background: #fff3e7;
            padding: 50px 20px;
            border-radius: 14px;
        }

        .empty-orders h2 {
            color: #172b4d;
            margin-bottom: 12px;
        }

        .shop-now-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #e87932;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .shop-now-btn:hover {
            background: #c85d20;
        }

        .continue-shopping {
            text-align: center;
        }

        .orders-loading,
        .orders-error {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .order-details {
                grid-template-columns: 1fr;
            }

            .order-card {
                padding: 18px;
            }

            .tracking-section {
                padding: 18px 8px;
            }

            .tracking-step p {
                font-size: 9px;
            }

            .tracking-circle {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }

            .tracking-progress::before {
                top: 13px;
            }

            .tracking-line {
                top: 13px;
            }

            .order-item {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="orders-container">

        <h1>My Orders</h1>

        <div id="ordersContainer"></div>

        <div class="continue-shopping">
            <a href="index.html" class="shop-now-btn">
                Continue Shopping
            </a>
        </div>

    </div>

    <script src="js/orders.js"></script>

</body>
</html>
